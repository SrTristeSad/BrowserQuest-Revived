name: Phase 3 Player Mute Patch

on:
  push:
    branches: [phase3-player-mute-backend]

permissions:
  contents: write

jobs:
  patch-player-mute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply player mute patch
        run: node scripts/phase3-player-mute-patch.mjs
      - name: Syntax checks
        run: |
          node --check server/auth/player-auth.js
          node --check server/js/player.js
          node --check server/js/main.js
          node --check server/admin/http.js
      - name: Commit player mute patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+SrTristeSad@users.noreply.github.com"
          git add server/auth/player-auth.js server/js/player.js server/js/main.js server/admin/http.js
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "feat: add temporary player mute backend"
            git push
          fi
