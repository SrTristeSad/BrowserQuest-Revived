name: BrowserQuest CI

on:
  push:
    branches: [main, modernize-node]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  server-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax checks
        run: npm run check

      - name: Start server and verify status endpoint
        shell: bash
        run: |
          set -euo pipefail
          node server/js/main.js > /tmp/browserquest-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/status > /tmp/browserquest-status.json; then
              cat /tmp/browserquest-status.json
              exit 0
            fi
            sleep 1
          done

          cat /tmp/browserquest-server.log
          exit 1
