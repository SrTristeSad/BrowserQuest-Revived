name: BrowserQuest CI

on:
  push:
    branches: [main, modernize-node, aapanel-visual-installer, world-editor, pgsql-redis-accounts]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  server-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Start PostgreSQL and Redis
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null || ! command -v redis-server >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql redis-server
          fi
          sudo service postgresql start
          sudo service redis-server start
          if ! sudo -u postgres psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='browserquest'" | grep -q 1; then
            sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE browserquest LOGIN PASSWORD 'browserquest_test'"
          fi
          if ! sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='browserquest'" | grep -q 1; then
            sudo -u postgres createdb -O browserquest browserquest
          fi
          PGPASSWORD=browserquest_test psql -h 127.0.0.1 -U browserquest -d browserquest -c 'SELECT 1'
          redis-cli ping | grep -q PONG

      - name: Syntax and aaPanel checks
        run: |
          npm run check
          npm run doctor:aapanel

      - name: Verify PostgreSQL and Redis migrations
        env:
          TEST_PG_HOST: 127.0.0.1
          TEST_PG_PORT: 5432
          TEST_PG_DATABASE: browserquest
          TEST_PG_USER: browserquest
          TEST_PG_PASSWORD: browserquest_test
          TEST_REDIS_HOST: 127.0.0.1
          TEST_REDIS_PORT: 6379
          TEST_REDIS_DATABASE: 0
        run: node test/infrastructure-live-smoke.js

      - name: Verify direct game server HTTP/WebSocket
        shell: bash
        run: |
          set -euo pipefail
          node server/js/main.js > /tmp/browserquest-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/status > /tmp/browserquest-status.json; then
              cat /tmp/browserquest-status.json
              curl --fail --silent http://127.0.0.1:8000/ | grep -qi BrowserQuest
              node test/websocket-smoke.js
              exit 0
            fi
            sleep 1
          done

          cat /tmp/browserquest-server.log
          exit 1

      - name: Verify installer, PostgreSQL, Redis, admin and editors
        shell: bash
        run: |
          set -euo pipefail
          SETUP_DIR="$(mktemp -d)"
          export BROWSERQUEST_CONFIG_DIR="$SETUP_DIR/config"
          export PORT=8010
          node app.js > /tmp/browserquest-setup.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true; rm -rf "$SETUP_DIR"' EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8010/setup > /tmp/setup.html; then
              break
            fi
            sleep 1
          done

          grep -qi 'BrowserQuest Revived' /tmp/setup.html
          grep -qi 'PostgreSQL' /tmp/setup.html
          grep -qi 'Redis' /tmp/setup.html
          grep -qi 'Conta do dono' /tmp/setup.html
          CODE="$(grep -oE 'CÓDIGO DE INSTALAÇÃO: [0-9]{6}' /tmp/browserquest-setup.log | tail -1 | grep -oE '[0-9]{6}')"
          test -n "$CODE"

          cat > /tmp/setup-payload.json <<JSON
          {"code":"$CODE","worlds":2,"players":10,"accessMode":"mixed","pgHost":"127.0.0.1","pgPort":5432,"pgDatabase":"browserquest","pgUser":"browserquest","pgPassword":"browserquest_test","pgSsl":false,"redisHost":"127.0.0.1","redisPort":6379,"redisUsername":"","redisPassword":"","redisDatabase":0,"redisTls":false,"adminUsername":"owner","adminPassword":"StrongPassword123!","adminPasswordConfirm":"StrongPassword123!"}
          JSON

          curl --fail --silent -H 'content-type: application/json' --data-binary @/tmp/setup-payload.json http://127.0.0.1:8010/setup/test-postgres | grep -q '"ok":true'
          curl --fail --silent -H 'content-type: application/json' --data-binary @/tmp/setup-payload.json http://127.0.0.1:8010/setup/test-redis | grep -q '"ok":true'
          curl --fail --silent -H 'content-type: application/json' --data-binary @/tmp/setup-payload.json http://127.0.0.1:8010/setup/install | grep -q '"ok":true'

          for attempt in $(seq 1 20); do
            curl --silent http://127.0.0.1:8010/status > /tmp/installed-status.json || true
            if grep -q '^\[' /tmp/installed-status.json; then
              break
            fi
            sleep 1
          done

          grep -q '^\[' /tmp/installed-status.json
          grep -q 'PostgreSQL conectado' /tmp/browserquest-setup.log
          grep -q 'Redis conectado' /tmp/browserquest-setup.log
          curl --fail --silent http://127.0.0.1:8010/ | grep -qi BrowserQuest
          TEST_WS_URL=ws://127.0.0.1:8010/ node test/websocket-smoke.js
          test -f "$SETUP_DIR/config/browserquest.json"
          test -f "$SETUP_DIR/config/admin.json"
          test ! -f "$SETUP_DIR/config/setup-token.txt"
          grep -q '"passwordHash": "scrypt\$' "$SETUP_DIR/config/admin.json"
          grep -q '"infrastructure"' "$SETUP_DIR/config/browserquest.json"
          grep -q '"access_mode": "mixed"' "$SETUP_DIR/config/browserquest.json"
          ! grep -q 'StrongPassword123!' "$SETUP_DIR/config/admin.json"

          PGPASSWORD=browserquest_test psql -h 127.0.0.1 -U browserquest -d browserquest -tAc "SELECT role || ':' || status FROM users WHERE username='owner'" | grep -q 'owner:active'
          PGPASSWORD=browserquest_test psql -h 127.0.0.1 -U browserquest -d browserquest -tAc "SELECT value #>> '{}' FROM settings WHERE key='access_mode'" | grep -q mixed

          curl --fail --silent http://127.0.0.1:8010/admin/login | grep -qi 'PAINEL ADMINISTRATIVO'
          curl --fail --silent -c /tmp/bq-cookies.txt \
            -H 'content-type: application/json' \
            -d '{"username":"owner","password":"StrongPassword123!"}' \
            http://127.0.0.1:8010/admin/api/login | grep -q '"ok":true'

          curl --fail --silent -b /tmp/bq-cookies.txt http://127.0.0.1:8010/admin/story-editor | grep -qi 'Editor de História'
          curl --fail --silent -b /tmp/bq-cookies.txt http://127.0.0.1:8010/admin/world-editor | grep -qi 'Editor de Mundo'

          cat > /tmp/story.json <<'JSON'
          {
            "title": "A Ponte dos Ratos",
            "description": "Campanha de teste do editor.",
            "status": "draft",
            "chapters": [{
              "title": "Primeiro capítulo",
              "missions": [{
                "title": "Limpe a ponte",
                "giverNpc": "Guarda",
                "introDialogue": [{"speaker":"Guarda","text":"A ponte está tomada."}],
                "objective": {"type":"kill","target":"rat","amount":5,"text":"Derrote 5 ratos"},
                "rewards": [{"type":"item","value":"sword2","amount":1}],
                "choices": []
              }]
            }]
          }
          JSON

          curl --fail --silent -b /tmp/bq-cookies.txt -H 'content-type: application/json' --data-binary @/tmp/story.json http://127.0.0.1:8010/admin/api/stories > /tmp/saved-story.json
          grep -q 'A Ponte dos Ratos' /tmp/saved-story.json
          STORY_ID="$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/saved-story.json','utf8')).id)")"
          test -n "$STORY_ID"
          curl --fail --silent -b /tmp/bq-cookies.txt http://127.0.0.1:8010/admin/api/stories | grep -q "$STORY_ID"

          node - <<'NODE'
          const fs = require('fs');
          const story = JSON.parse(fs.readFileSync('/tmp/saved-story.json', 'utf8'));
          story.status = 'published';
          fs.writeFileSync('/tmp/published-story.json', JSON.stringify(story));
          NODE
          curl --fail --silent -b /tmp/bq-cookies.txt -H 'content-type: application/json' --data-binary @/tmp/published-story.json http://127.0.0.1:8010/admin/api/stories | grep -q '"status":"published"'
          curl --fail --silent -b /tmp/bq-cookies.txt -X DELETE http://127.0.0.1:8010/admin/api/stories/$STORY_ID | grep -q '"ok":true'

          curl --fail --silent -b /tmp/bq-cookies.txt http://127.0.0.1:8010/admin/api/world > /tmp/world.json
          node - <<'NODE'
          const fs = require('fs');
          const world = JSON.parse(fs.readFileSync('/tmp/world.json', 'utf8'));
          world.npcs.push({
            id: 'npc_test_guard', name: 'Guarda do Teste', baseKind: 'guard', enabled: true,
            dialogue: ['Pare aí, aventureiro.', 'Este diálogo veio do Editor de Mundo.'],
            storyId: 'story-test', missionId: 'mission-test', completionMissionId: ''
          });
          world.mobs.push({
            id: 'mob_test_rat', name: 'Rato Alfa', baseKind: 'rat', enabled: true,
            hitPoints: 321, armorLevel: 4, weaponLevel: 7, respawnMs: 4321, aggroDistance: 33,
            drops: [{kind: 'flask', chance: 50}]
          });
          world.map.entities.push({id:'editor_npc_test',x:10,y:10,kind:'guard',profileType:'npc',profileId:'npc_test_guard',source:'editor'});
          world.map.entities.push({id:'editor_mob_test',x:12,y:10,kind:'rat',profileType:'mob',profileId:'mob_test_rat',source:'editor'});
          world.map.roamingAreas.push({id:987654,x:20,y:20,width:4,height:4,nb:2,type:'rat',profileId:'mob_test_rat'});
          const collision = 21 * world.map.width + 21;
          if (!world.map.collisions.includes(collision)) world.map.collisions.push(collision);
          fs.writeFileSync('/tmp/world-edited.json', JSON.stringify(world));
          NODE

          curl --fail --silent -b /tmp/bq-cookies.txt -H 'content-type: application/json' --data-binary @/tmp/world-edited.json http://127.0.0.1:8010/admin/api/world > /tmp/world-saved.json
          grep -q 'Guarda do Teste' /tmp/world-saved.json
          grep -q 'Rato Alfa' /tmp/world-saved.json

          curl --fail --silent -b /tmp/bq-cookies.txt -X POST -H 'content-type: application/json' -d '{}' http://127.0.0.1:8010/admin/api/world/publish > /tmp/world-publish.json
          grep -q '"ok":true' /tmp/world-publish.json
          grep -q '"clientMapSynchronized":true' /tmp/world-publish.json
          test -f "$SETUP_DIR/config/world_server_published.json"
          test -f "$SETUP_DIR/config/world_client_published.json"
          test -f "$SETUP_DIR/config/world_client_published.js"

          node - <<'NODE'
          const fs = require('fs');
          const dir = process.env.BROWSERQUEST_CONFIG_DIR;
          const server = JSON.parse(fs.readFileSync(dir + '/world_server_published.json', 'utf8'));
          const client = JSON.parse(fs.readFileSync(dir + '/world_client_published.json', 'utf8'));
          if (server.editorProfiles.npcs.npc_test_guard.name !== 'Guarda do Teste') throw new Error('custom NPC missing');
          if (server.editorProfiles.mobs.mob_test_rat.hitPoints !== 321) throw new Error('custom mob stats missing');
          if (!server.roamingAreas.some(a => a.profileId === 'mob_test_rat')) throw new Error('custom roaming area missing');
          if (server.editorRevision !== client.editorRevision) throw new Error('client/server revision mismatch');
          if (!client.collisions.includes(21 * client.width + 21)) throw new Error('published client collision missing');
          NODE

          curl --fail --silent http://127.0.0.1:8010/maps/world_client.json | grep -q '"editorRevision"'
          curl --fail --silent http://127.0.0.1:8010/maps/world_client.js | grep -q 'var mapData ='

          kill "$APP_PID"
          wait "$APP_PID" 2>/dev/null || true
          node app.js > /tmp/browserquest-restart.log 2>&1 &
          APP_PID=$!
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8010/status | grep -q '^\['; then
              break
            fi
            sleep 1
          done
          grep -q 'Loading published world from World Editor' /tmp/browserquest-restart.log
          grep -q 'PostgreSQL conectado' /tmp/browserquest-restart.log
          grep -q 'Redis conectado' /tmp/browserquest-restart.log
          TEST_WS_URL=ws://127.0.0.1:8010/ node test/websocket-smoke.js
