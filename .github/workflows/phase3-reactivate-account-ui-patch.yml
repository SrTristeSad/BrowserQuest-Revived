name: Phase 3 Reactivate Account UI Patch

on:
  push:
    branches: [phase3-reactivate-account-ui]

permissions:
  contents: write

jobs:
  patch-reactivate-account-ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply reactivate account UI patch
        run: node scripts/phase3-reactivate-account-ui-patch.mjs
      - name: Verify expected dashboard controls
        run: |
          grep -q "async function reactivateAccount" server/admin/public/dashboard.html
          grep -q "reactivatebtn" server/admin/public/dashboard.html
          grep -q "/reactivate'" server/admin/public/dashboard.html
      - name: Commit reactivate account UI patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+SrTristeSad@users.noreply.github.com"
          git add server/admin/public/dashboard.html
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "feat: add reactivate account control to dashboard"
            git push
          fi
