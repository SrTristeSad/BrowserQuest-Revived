name: Apply World Editor runtime

on:
  push:
    branches: [world-editor]
    paths: [.github/workflows/apply-world-editor-runtime.yml]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Patch runtime and client
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'target not found in {path}: {old[:80]!r}')
              p.write_text(s.replace(old,new,count))

          # Admin world store: include synchronized client map output paths.
          replace('server/admin/http.js',
          """        world = new WorldStore({\n            baseMapPath: path.join(__dirname, '..', 'maps', 'world_server.json'),\n            statePath: path.join(configDir, 'world-editor.json'),\n            publishedMapPath: path.join(configDir, 'world_server_published.json'),\n            versionsDir: path.join(configDir, 'world-versions')\n        }),""",
          """        world = new WorldStore({\n            baseMapPath: path.join(__dirname, '..', 'maps', 'world_server.json'),\n            baseClientMapPath: path.join(__dirname, '..', '..', 'client', 'maps', 'world_client.json'),\n            statePath: path.join(configDir, 'world-editor.json'),\n            publishedMapPath: path.join(configDir, 'world_server_published.json'),\n            publishedClientJsonPath: path.join(configDir, 'world_client_published.json'),\n            publishedClientJsPath: path.join(configDir, 'world_client_published.js'),\n            versionsDir: path.join(configDir, 'world-versions')\n        }),""")

          # Static server: serve the client-side map generated by the World Editor.
          replace('server/js/ws.js',
          """var projectRoot = path.resolve(__dirname, '../..'),\n    clientRoot = path.join(projectRoot, 'client'),\n    sharedRoot = path.join(projectRoot, 'shared');""",
          """var projectRoot = path.resolve(__dirname, '../..'),\n    clientRoot = path.join(projectRoot, 'client'),\n    sharedRoot = path.join(projectRoot, 'shared'),\n    publishedClientRoot = process.env.BROWSERQUEST_CONFIG_DIR || path.join(projectRoot, 'var', 'config');""")
          replace('server/js/ws.js',
          """function resolveStaticFile(requestPath) {\n    var root,\n        relative,\n        resolved;\n\n    if(requestPath.indexOf('/shared/') === 0) {""",
          """function resolveStaticFile(requestPath) {\n    var root,\n        relative,\n        resolved,\n        published;\n\n    if(requestPath === '/maps/world_client.json') {\n        published = path.join(publishedClientRoot, 'world_client_published.json');\n        if(fs.existsSync(published)) {\n            return published;\n        }\n    }\n    if(requestPath === '/maps/world_client.js') {\n        published = path.join(publishedClientRoot, 'world_client_published.js');\n        if(fs.existsSync(published)) {\n            return published;\n        }\n    }\n\n    if(requestPath.indexOf('/shared/') === 0) {""")

          # World runtime: custom roaming profiles, chase distance, static metadata and drops.
          replace('server/js/worldserver.js',
          """            _.each(self.map.mobAreas, function(a) {\n                var area = new MobArea(a.id, a.nb, a.type, a.x, a.y, a.width, a.height, self);\n                area.spawnMobs();""",
          """            _.each(self.map.mobAreas, function(a) {\n                var profile = a.profileId && self.map.editorProfiles && self.map.editorProfiles.mobs ? self.map.editorProfiles.mobs[a.profileId] : null,\n                    area = new MobArea(a.id, a.nb, a.type, a.x, a.y, a.width, a.height, self, profile);\n                area.spawnMobs();""")
          replace('server/js/worldserver.js',
          """                        if(mob.distanceToSpawningPoint(pos.x, pos.y) > 50) {""",
          """                        if(mob.distanceToSpawningPoint(pos.x, pos.y) > (mob.aggroDistance || 50)) {""")
          replace('server/js/worldserver.js',
          """    addNpc: function(kind, x, y) {\n        var npc = new Npc('8'+x+''+y, kind, x, y);""",
          """    addNpc: function(kind, x, y, editorData) {\n        var npc = new Npc('8'+x+''+y, kind, x, y, editorData);""")
          replace('server/js/worldserver.js',
          """        _.each(this.map.staticEntities, function(kindName, tid) {\n            var kind = Types.getKindFromString(kindName),\n                pos = self.map.tileIndexToGridPosition(tid);\n            \n            if(Types.isNpc(kind)) {\n                self.addNpc(kind, pos.x + 1, pos.y);\n            }\n            if(Types.isMob(kind)) {\n                var mob = new Mob('7' + kind + count++, kind, pos.x + 1, pos.y);\n                mob.onRespawn(function() {""",
          """        _.each(this.map.staticEntities, function(kindName, tid) {\n            var kind = Types.getKindFromString(kindName),\n                pos = self.map.tileIndexToGridPosition(tid),\n                metadata = self.map.editorMetadata ? self.map.editorMetadata[String(tid)] : null,\n                editorData = null;\n\n            if(metadata && self.map.editorProfiles) {\n                if(metadata.type === 'npc' && self.map.editorProfiles.npcs) {\n                    editorData = self.map.editorProfiles.npcs[metadata.profileId] || null;\n                } else if(metadata.type === 'mob' && self.map.editorProfiles.mobs) {\n                    editorData = self.map.editorProfiles.mobs[metadata.profileId] || null;\n                }\n            }\n            \n            if(Types.isNpc(kind)) {\n                self.addNpc(kind, pos.x + 1, pos.y, editorData);\n            }\n            if(Types.isMob(kind)) {\n                var mob = new Mob('7' + kind + count++, kind, pos.x + 1, pos.y, editorData);\n                mob.onRespawn(function() {""")
          replace('server/js/worldserver.js',
          """    getDroppedItem: function(mob) {\n        var kind = Types.getKindAsString(mob.kind),\n            drops = Properties[kind].drops,\n            v = Utils.random(100),\n            p = 0,\n            item = null;\n        \n        for(var itemName in drops) {\n            var percentage = drops[itemName];\n            \n            p += percentage;\n            if(v <= p) {\n                item = this.addItem(this.createItem(Types.getKindFromString(itemName), mob.x, mob.y));\n                break;\n            }\n        }\n        \n        return item;\n    },""",
          """    getDroppedItem: function(mob) {\n        var kind = Types.getKindAsString(mob.kind),\n            customDrops = mob.editorData && Array.isArray(mob.editorData.drops) ? mob.editorData.drops : null,\n            drops = Properties[kind].drops,\n            v = Utils.random(100),\n            p = 0,\n            item = null,\n            itemKind;\n\n        if(customDrops && customDrops.length) {\n            _.each(customDrops, function(drop) {\n                if(item) { return; }\n                p += Number(drop.chance) || 0;\n                itemKind = Types.getKindFromString(drop.kind);\n                if(itemKind && v <= p) {\n                    item = this.addItem(this.createItem(itemKind, mob.x, mob.y));\n                }\n            }, this);\n            return item;\n        }\n        \n        for(var itemName in drops) {\n            var percentage = drops[itemName];\n            p += percentage;\n            if(v <= p) {\n                item = this.addItem(this.createItem(Types.getKindFromString(itemName), mob.x, mob.y));\n                break;\n            }\n        }\n        return item;\n    },""")

          # Browser client: accept editor metadata appended to spawn messages.
          p=Path('client/js/gameclient.js'); s=p.read_text()
          start=s.index('        receiveSpawn: function(data) {')
          end=s.index('        receiveDespawn: function(data) {', start)
          new_spawn='''        receiveSpawn: function(data) {\n            var id = data[1],\n                kind = data[2],\n                x = data[3],\n                y = data[4];\n        \n            if(Types.isItem(kind)) {\n                var item = EntityFactory.createEntity(kind, id);\n                if(this.spawn_item_callback) { this.spawn_item_callback(item, x, y); }\n            } else if(Types.isChest(kind)) {\n                var chest = EntityFactory.createEntity(kind, id);\n                if(this.spawn_chest_callback) { this.spawn_chest_callback(chest, x, y); }\n            } else {\n                var name, orientation, target, weapon, armor, editorData = null;\n            \n                if(Types.isPlayer(kind)) {\n                    name = data[5]; orientation = data[6]; armor = data[7]; weapon = data[8];\n                    if(data.length > 9) { target = data[9]; }\n                } else if(Types.isMob(kind)) {\n                    orientation = data[5];\n                    if(typeof data[6] === 'number') { target = data[6]; }\n                    editorData = data[7] || (data[6] && typeof data[6] === 'object' ? data[6] : null);\n                } else if(Types.isNpc(kind)) {\n                    editorData = data[5] && typeof data[5] === 'object' ? data[5] : null;\n                }\n\n                var character = EntityFactory.createEntity(kind, id, name);\n                if(character instanceof Player) {\n                    character.weaponName = Types.getKindAsString(weapon);\n                    character.spriteName = Types.getKindAsString(armor);\n                }\n                if(editorData) {\n                    character.editorData = editorData;\n                    character.name = editorData.name || character.name;\n                    if(character.setEditorData) { character.setEditorData(editorData); }\n                }\n                if(this.spawn_character_callback) {\n                    this.spawn_character_callback(character, x, y, orientation, target);\n                }\n            }\n        },\n    \n'''
          p.write_text(s[:start] + new_spawn + s[end:])

          # Client NPC dialogue: custom profile dialogue overrides the original hardcoded lines.
          p=Path('client/js/npc.js'); s=p.read_text()
          start=s.index('    var Npc = Character.extend({')
          end=s.index('    return Npc;', start)
          new_npc='''    var Npc = Character.extend({\n        init: function(id, kind) {\n            this._super(id, kind, 1);\n            this.itemKind = Types.getKindAsString(this.kind);\n            this.editorData = null;\n            this.customDialogue = null;\n            this.talkCount = (NpcTalk[this.itemKind] || []).length;\n            this.talkIndex = 0;\n        },\n\n        setEditorData: function(data) {\n            this.editorData = data || null;\n            this.customDialogue = data && data.dialogue && data.dialogue.length ? data.dialogue.slice() : null;\n            this.talkCount = this.customDialogue ? this.customDialogue.length : (NpcTalk[this.itemKind] || []).length;\n            this.talkIndex = 0;\n        },\n    \n        talk: function() {\n            var msg = null,\n                lines = this.customDialogue || NpcTalk[this.itemKind] || [];\n            if(this.talkIndex >= lines.length) { this.talkIndex = 0; }\n            if(this.talkIndex < lines.length) { msg = lines[this.talkIndex]; }\n            this.talkIndex += 1;\n            return msg;\n        }\n    });\n    \n'''
          p.write_text(s[:start] + new_npc + s[end:])

          # Add navigation between Story and World editors.
          replace('server/admin/public/story-editor.html',
          '<button class="navbtn" id="newStory">+ Nova história</button>',
          '<button class="navbtn" id="newStory">+ Nova história</button>\\n<a class="storybtn" style="display:block;text-decoration:none" href="/admin/world-editor"><strong>Editor de Mundo</strong><span class="meta">Mapa · NPCs · Mobs</span></a>')

          Path('.github/workflows/apply-world-editor-runtime.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server client .github/workflows/apply-world-editor-runtime.yml
          git commit -m "feat: integrate custom world profiles with game runtime"
          git push origin world-editor
