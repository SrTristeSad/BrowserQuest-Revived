name: Phase 4 Story Progress Runtime Wire

on:
  push:
    branches: [phase4-story-progress-runtime-wire]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply patch
        run: node scripts/phase4-story-progress-runtime-wire.mjs
      - name: Syntax check
        run: node --check server/bootstrap.js && node --check server/js/main.js && node --check server/js/player.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/bootstrap.js server/js/main.js server/js/player.js
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "feat: wire story progress store into authenticated players"
            git push
          fi
