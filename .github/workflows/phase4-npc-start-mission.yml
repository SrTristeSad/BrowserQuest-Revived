name: Phase 4 NPC Start Mission

on:
  push:
    branches: [phase4-npc-start-mission]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply patch
        run: node scripts/phase4-npc-start-mission.mjs
      - name: Syntax check
        run: node --check server/js/worldserver.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+SrTristeSad@users.noreply.github.com"
          git add server/js/worldserver.js
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "feat: start linked story mission from NPC interaction"
            git push
          fi
