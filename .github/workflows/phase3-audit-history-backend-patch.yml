name: Phase 3 Audit History Backend Patch

on:
  push:
    branches: [phase3-audit-history-backend]

permissions:
  contents: write

jobs:
  patch-audit-history:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply audit history backend patch
        run: node scripts/phase3-audit-history-backend-patch.mjs
      - name: Syntax check
        run: node --check server/admin/http.js
      - name: Commit audit history backend patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+SrTristeSad@users.noreply.github.com"
          git add server/admin/http.js
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "feat: add admin audit history API"
            git push
          fi
