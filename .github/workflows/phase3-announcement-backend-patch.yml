name: Phase 3 Announcement Backend Patch

on:
  push:
    branches: [phase3-announcement-backend]

permissions:
  contents: write

jobs:
  patch-announcement-backend:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply announcement backend patch
        run: node scripts/phase3-announcement-backend-patch.mjs
      - name: Syntax check
        run: |
          node --check shared/js/gametypes.js
          node --check client/js/gameclient.js
          node --check server/js/main.js
          node --check server/admin/http.js
      - name: Commit announcement backend patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+SrTristeSad@users.noreply.github.com"
          git add shared/js/gametypes.js client/js/gameclient.js server/js/main.js server/admin/http.js
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "feat: add admin announcement transport"
            git push
          fi
