name: Phase 3 Server Capacity UI Patch

on:
  push:
    branches: [phase3-server-capacity-ui]

permissions:
  contents: write

jobs:
  patch-server-capacity-ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply server capacity UI patch
        run: node scripts/phase3-server-capacity-ui-patch.mjs
      - name: Verify server capacity UI
        run: |
          grep -q 'Capacidade do servidor' server/admin/public/settings.html
          grep -q '/admin/api/settings/server' server/admin/public/settings.html
          grep -q 'Reinicie o Projeto Node.js no aaPanel' server/admin/public/settings.html
      - name: Commit server capacity UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+SrTristeSad@users.noreply.github.com"
          git add server/admin/public/settings.html
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "feat: add server capacity controls to settings"
            git push
          fi
