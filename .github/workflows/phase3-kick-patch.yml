name: Phase 3 Kick Patch

on:
  push:
    branches: [phase3-kick-player]

permissions:
  contents: write

jobs:
  patch-kick:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply kick patch
        run: node scripts/phase3-kick-patch.mjs
      - name: Syntax checks
        run: |
          node --check server/js/main.js
          node --check server/admin/http.js
      - name: Commit kick patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/js/main.js server/admin/http.js
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "feat: add audited player kick"
            git push
          fi
