name: Apply Brain System runtime

on:
  push:
    branches: [brain-system]
    paths:
      - '.github/workflows/apply-brain-runtime.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: brain-system
          fetch-depth: 0

      - name: Apply Brain System patch
        run: python3 scripts/apply-brain-patch.py

      - name: Validate syntax
        run: npm run check

      - name: Commit generated integration
        shell: bash
        run: |
          git config user.name 'SrTristeSad'
          git config user.email '48489740+SrTristeSad@users.noreply.github.com'
          git add server/js/worldserver.js server/admin/world-store.js server/admin/public/world-editor.html package.json
          git rm .github/workflows/apply-brain-runtime.yml scripts/apply-brain-patch.py
          git commit -m 'feat: wire Brain System into NPCs, mobs and World Editor'
          git push origin brain-system
