name: Apply Brain System runtime

on:
  push:
    branches: [brain-system]
    paths:
      - '.github/workflows/apply-brain-runtime.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: brain-system
          fetch-depth: 0

      - name: Patch Brain System integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Patch anchor not found: {label}')
              return text.replace(old, new, 1)

          # ---- worldserver.js ----
          p = Path('server/js/worldserver.js')
          s = p.read_text()
          s = replace_once(
              s,
              '    Utils = require("./utils"),\n    Types = require("../../shared/js/gametypes");',
              '    Utils = require("./utils"),\n    Types = require("../../shared/js/gametypes"),\n    Brain = require("./brain").Brain;',
              'worldserver require Brain'
          )
          s = replace_once(
              s,
              '        this.npcs = {};\n        this.mobAreas = [];',
              '        this.npcs = {};\n        this.brains = {};\n        this.mobAreas = [];',
              'worldserver brains collection'
          )
          s = replace_once(
              s,
              '        entity.destroy();\n        this.removeFromGroups(entity);',
              '        if(this.brains[entity.id]) {\n            this.brains[entity.id].destroy();\n            delete this.brains[entity.id];\n        }\n\n        entity.destroy();\n        this.removeFromGroups(entity);',
              'worldserver brain cleanup'
          )
          s = replace_once(
              s,
              '    addMob: function(mob) {\n        this.addEntity(mob);\n        this.mobs[mob.id] = mob;\n    },',
              '    addMob: function(mob) {\n        this.addEntity(mob);\n        this.mobs[mob.id] = mob;\n        this.attachBrain(mob);\n    },',
              'worldserver addMob'
          )
          old = '''    addNpc: function(kind, x, y, editorData) {\n        var npc = new Npc('8'+x+''+y, kind, x, y, editorData);\n        this.addEntity(npc);\n        this.npcs[npc.id] = npc;\n        \n        return npc;\n    },'''
          new = '''    addNpc: function(kind, x, y, editorData) {\n        var npc = new Npc('8'+x+''+y, kind, x, y, editorData);\n        this.addEntity(npc);\n        this.npcs[npc.id] = npc;\n        this.attachBrain(npc);\n        \n        return npc;\n    },\n\n    attachBrain: function(entity) {\n        var config;\n        if(!entity || (entity.type !== 'npc' && entity.type !== 'mob')) {\n            return null;\n        }\n        if(this.brains[entity.id]) {\n            return this.brains[entity.id];\n        }\n        config = entity.editorData && entity.editorData.brain ? entity.editorData.brain : null;\n        this.brains[entity.id] = new Brain(entity, this, config);\n        this.brains[entity.id].start();\n        return this.brains[entity.id];\n    },\n\n    moveBrainEntity: function(entity, x, y) {\n        if(!entity || !this.isValidPosition(x, y)) {\n            return false;\n        }\n        if(entity.type === 'mob' && typeof entity.move === 'function') {\n            entity.move(x, y);\n        } else {\n            entity.setPosition(x, y);\n            this.pushToAdjacentGroups(entity.group, new Messages.Move(entity));\n            this.handleEntityGroupMembership(entity);\n        }\n        return true;\n    },\n\n    isPositionOccupied: function(x, y, ignoredId) {\n        var occupied = false;\n        this.forEachEntity(function(entity) {\n            if(!occupied && entity.id !== ignoredId && !entity.isDead && entity.x === x && entity.y === y && (entity.type === 'player' || entity.type === 'mob' || entity.type === 'npc')) {\n                occupied = true;\n            }\n        });\n        return occupied;\n    },'''
          s = replace_once(s, old, new, 'worldserver addNpc + brain methods')
          p.write_text(s)

          # ---- world-store.js ----
          p = Path('server/admin/world-store.js')
          s = p.read_text()
          anchor = '''function bool(value) {\n    return value !== false;\n}\n'''
          addition = '''function bool(value) {\n    return value !== false;\n}\n\nfunction normalizeBrain(brain, fallbackPreset) {\n    brain = brain || {};\n    var presets = ['villager','merchant','guard','passive','aggressive','coward','territorial','companion'],\n        modes = ['wander','patrol','follow'],\n        preset = presets.indexOf(brain.preset) >= 0 ? brain.preset : fallbackPreset,\n        mode = modes.indexOf(brain.mode) >= 0 ? brain.mode : (preset === 'guard' ? 'patrol' : (preset === 'companion' ? 'follow' : 'wander')),\n        moveChance = Number(brain.moveChance),\n        fleeBelowHp = Number(brain.fleeBelowHp),\n        patrol = Array.isArray(brain.patrol) ? brain.patrol.slice(0, 32).map(function(point) {\n            return {\n                x: int(point && point.x, 1, 1000, 1),\n                y: int(point && point.y, 1, 1000, 1)\n            };\n        }) : [];\n\n    if(!Number.isFinite(moveChance)) { moveChance = 0.6; }\n    if(!Number.isFinite(fleeBelowHp)) { fleeBelowHp = preset === 'coward' ? 0.4 : 0; }\n\n    return {\n        enabled: brain.enabled !== false,\n        preset: preset,\n        mode: mode,\n        thinkMs: int(brain.thinkMs, 400, 10000, 1200),\n        vision: int(brain.vision, 1, 50, 7),\n        wanderRadius: int(brain.wanderRadius, 1, 50, 6),\n        moveChance: Math.max(0, Math.min(1, moveChance)),\n        fleeFromMobs: brain.fleeFromMobs === true,\n        fleeBelowHp: Math.max(0, Math.min(0.95, fleeBelowHp)),\n        aggressive: brain.aggressive === true,\n        leash: int(brain.leash, 2, 100, 10),\n        followDistance: int(brain.followDistance, 1, 10, 2),\n        patrol: patrol\n    };\n}\n'''
          s = replace_once(s, anchor, addition, 'world-store normalizeBrain')
          s = replace_once(
              s,
              "        completionMissionId: text(profile.completionMissionId, 80)\n    };",
              "        completionMissionId: text(profile.completionMissionId, 80),\n        brain: normalizeBrain(profile.brain, (baseKind === 'guard' || baseKind === 'king') ? 'guard' : 'villager')\n    };",
              'world-store npc brain'
          )
          s = replace_once(
              s,
              "        aggroDistance: int(profile.aggroDistance, 1, 200, 50),\n        drops: normalizeDrops(profile.drops)\n    };",
              "        aggroDistance: int(profile.aggroDistance, 1, 200, 50),\n        drops: normalizeDrops(profile.drops),\n        brain: normalizeBrain(profile.brain, 'aggressive')\n    };",
              'world-store mob brain'
          )
          p.write_text(s)

          # ---- World Editor UI ----
          p = Path('server/admin/public/world-editor.html')
          s = p.read_text()
          npc_anchor = '<div class="field"><label>Missão que conclui</label><input id="npcCompletion" maxlength="80"></div>\n<input id="npcId" type="hidden">'
          npc_ui = '''<div class="field"><label>Missão que conclui</label><input id="npcCompletion" maxlength="80"></div>\n<hr class="hr"><div class="subhead">Cérebro 🧠</div><div class="notice">NPCs não ficam parados por padrão. Escolha um comportamento e ajuste somente se precisar.</div>\n<div class="field"><label>Preset</label><select id="npcBrainPreset"><option value="villager">Aldeão</option><option value="merchant">Comerciante</option><option value="guard">Guarda</option><option value="companion">Companheiro</option></select></div>\n<div class="field"><label>Comportamento</label><select id="npcBrainMode"><option value="wander">Andar pela área</option><option value="patrol">Patrulhar rota</option><option value="follow">Seguir jogador</option></select></div>\n<div class="row"><div class="field"><label>Visão (tiles)</label><input id="npcBrainVision" type="number" min="1" max="50" value="6"></div><div class="field"><label>Raio de movimento</label><input id="npcBrainRadius" type="number" min="1" max="50" value="5"></div></div>\n<div class="field"><label>Tempo para pensar (ms)</label><input id="npcBrainThink" type="number" min="400" max="10000" value="1800"></div>\n<div class="field"><label>Rota de patrulha</label><textarea id="npcBrainPatrol" placeholder="x,y por linha. Ex.:&#10;20,15&#10;28,15&#10;28,22"></textarea><div class="small">Usado somente em Patrulhar rota.</div></div>\n<label class="toggle"><input id="npcBrainFlee" type="checkbox" checked> Fugir de mobs próximos</label>\n<input id="npcId" type="hidden">'''
          s = replace_once(s, npc_anchor, npc_ui, 'world-editor NPC brain UI')

          mob_anchor = '<div class="field"><label>Drops</label><textarea id="mobDrops" placeholder="flask:50&#10;sword1:5"></textarea><div class="small">Formato: item:chance%, uma linha por item.</div></div>\n<input id="mobId" type="hidden">'
          mob_ui = '''<div class="field"><label>Drops</label><textarea id="mobDrops" placeholder="flask:50&#10;sword1:5"></textarea><div class="small">Formato: item:chance%, uma linha por item.</div></div>\n<hr class="hr"><div class="subhead">Cérebro 🧠</div>\n<div class="field"><label>Preset</label><select id="mobBrainPreset"><option value="aggressive">Agressivo</option><option value="coward">Covarde</option><option value="territorial">Territorial</option><option value="passive">Passivo</option></select></div>\n<div class="row"><div class="field"><label>Visão (tiles)</label><input id="mobBrainVision" type="number" min="1" max="50" value="8"></div><div class="field"><label>Leash / território</label><input id="mobBrainLeash" type="number" min="2" max="100" value="12"></div></div>\n<div class="row"><div class="field"><label>Raio ao vagar</label><input id="mobBrainRadius" type="number" min="1" max="50" value="7"></div><div class="field"><label>Tempo para pensar (ms)</label><input id="mobBrainThink" type="number" min="400" max="10000" value="900"></div></div>\n<div class="field"><label>Fugir abaixo de HP (%)</label><input id="mobBrainFleeHp" type="number" min="0" max="95" value="0"><div class="small">0 desativa. Ex.: 40 faz o mob fugir abaixo de 40% de vida.</div></div>\n<input id="mobId" type="hidden">'''
          s = replace_once(s, mob_anchor, mob_ui, 'world-editor mob brain UI')

          old = "function newNpc(){['npcId','npcName','npcDialogue','npcStory','npcMission','npcCompletion'].forEach(i=>$(i).value='');$('npcBase').selectedIndex=0}function editNpc(id){const n=state.npcs.find(x=>x.id===id);if(!n)return;$('npcId').value=n.id;$('npcName').value=n.name;$('npcBase').value=n.baseKind;$('npcDialogue').value=n.dialogue.join('\\n');$('npcStory').value=n.storyId||'';$('npcMission').value=n.missionId||'';$('npcCompletion').value=n.completionMissionId||'';document.querySelector('[data-tab=\"npc\"]').click()}\nfunction saveNpc(){const id=$('npcId').value||'npc_'+Math.random().toString(16).slice(2),n={id,name:$('npcName').value||'Novo NPC',baseKind:$('npcBase').value,dialogue:$('npcDialogue').value.split('\\n').map(x=>x.trim()).filter(Boolean),storyId:$('npcStory').value,missionId:$('npcMission').value,completionMissionId:$('npcCompletion').value,enabled:true};const i=state.npcs.findIndex(x=>x.id===id);if(i>=0)state.npcs[i]=n;else state.npcs.push(n);$('npcId').value=id;markDirty();renderLists()}"
          new = "function parsePatrol(v){return v.split('\\n').map(l=>l.split(',')).filter(p=>p.length>=2&&Number.isFinite(+p[0])&&Number.isFinite(+p[1])).map(p=>({x:+p[0],y:+p[1]}))}function brainNpc(){return{enabled:true,preset:$('npcBrainPreset').value,mode:$('npcBrainMode').value,vision:+$('npcBrainVision').value,wanderRadius:+$('npcBrainRadius').value,thinkMs:+$('npcBrainThink').value,fleeFromMobs:$('npcBrainFlee').checked,patrol:parsePatrol($('npcBrainPatrol').value)}}function newNpc(){['npcId','npcName','npcDialogue','npcStory','npcMission','npcCompletion','npcBrainPatrol'].forEach(i=>$(i).value='');$('npcBase').selectedIndex=0;$('npcBrainPreset').value='villager';$('npcBrainMode').value='wander';$('npcBrainVision').value=6;$('npcBrainRadius').value=5;$('npcBrainThink').value=1800;$('npcBrainFlee').checked=true}function editNpc(id){const n=state.npcs.find(x=>x.id===id);if(!n)return;const b=n.brain||{};$('npcId').value=n.id;$('npcName').value=n.name;$('npcBase').value=n.baseKind;$('npcDialogue').value=n.dialogue.join('\\n');$('npcStory').value=n.storyId||'';$('npcMission').value=n.missionId||'';$('npcCompletion').value=n.completionMissionId||'';$('npcBrainPreset').value=b.preset||'villager';$('npcBrainMode').value=b.mode||'wander';$('npcBrainVision').value=b.vision||6;$('npcBrainRadius').value=b.wanderRadius||5;$('npcBrainThink').value=b.thinkMs||1800;$('npcBrainFlee').checked=b.fleeFromMobs!==false;$('npcBrainPatrol').value=(b.patrol||[]).map(p=>p.x+','+p.y).join('\\n');document.querySelector('[data-tab=\"npc\"]').click()}\nfunction saveNpc(){const id=$('npcId').value||'npc_'+Math.random().toString(16).slice(2),n={id,name:$('npcName').value||'Novo NPC',baseKind:$('npcBase').value,dialogue:$('npcDialogue').value.split('\\n').map(x=>x.trim()).filter(Boolean),storyId:$('npcStory').value,missionId:$('npcMission').value,completionMissionId:$('npcCompletion').value,brain:brainNpc(),enabled:true};const i=state.npcs.findIndex(x=>x.id===id);if(i>=0)state.npcs[i]=n;else state.npcs.push(n);$('npcId').value=id;markDirty();renderLists()}"
          s = replace_once(s, old, new, 'world-editor NPC JS')

          old = "function parseDrops(){return $('mobDrops').value.split('\\n').map(line=>{const p=line.split(':');return{kind:(p[0]||'').trim(),chance:+(p[1]||0)}}).filter(x=>x.kind&&x.chance>0)}function newMob(){['mobId','mobName','mobDrops'].forEach(i=>$(i).value='');$('mobHp').value=50;$('mobRespawn').value=30000;$('mobArmor').value=1;$('mobWeapon').value=1;$('mobAggro').value=50;$('mobBase').selectedIndex=0}function editMob(id){const m=state.mobs.find(x=>x.id===id);if(!m)return;$('mobId').value=m.id;$('mobName').value=m.name;$('mobBase').value=m.baseKind;$('mobHp').value=m.hitPoints;$('mobRespawn').value=m.respawnMs;$('mobArmor').value=m.armorLevel;$('mobWeapon').value=m.weaponLevel;$('mobAggro').value=m.aggroDistance;$('mobDrops').value=(m.drops||[]).map(d=>d.kind+':'+d.chance).join('\\n');document.querySelector('[data-tab=\"mob\"]').click()}\nfunction saveMob(){const id=$('mobId').value||'mob_'+Math.random().toString(16).slice(2),m={id,name:$('mobName').value||'Novo Mob',baseKind:$('mobBase').value,hitPoints:+$('mobHp').value,respawnMs:+$('mobRespawn').value,armorLevel:+$('mobArmor').value,weaponLevel:+$('mobWeapon').value,aggroDistance:+$('mobAggro').value,drops:parseDrops(),enabled:true};const i=state.mobs.findIndex(x=>x.id===id);if(i>=0)state.mobs[i]=m;else state.mobs.push(m);$('mobId').value=id;markDirty();renderLists()}"
          new = "function parseDrops(){return $('mobDrops').value.split('\\n').map(line=>{const p=line.split(':');return{kind:(p[0]||'').trim(),chance:+(p[1]||0)}}).filter(x=>x.kind&&x.chance>0)}function brainMob(){const preset=$('mobBrainPreset').value;return{enabled:true,preset,mode:'wander',vision:+$('mobBrainVision').value,wanderRadius:+$('mobBrainRadius').value,thinkMs:+$('mobBrainThink').value,leash:+$('mobBrainLeash').value,fleeBelowHp:(+$('mobBrainFleeHp').value||0)/100,aggressive:preset!=='passive'}}function newMob(){['mobId','mobName','mobDrops'].forEach(i=>$(i).value='');$('mobHp').value=50;$('mobRespawn').value=30000;$('mobArmor').value=1;$('mobWeapon').value=1;$('mobAggro').value=50;$('mobBase').selectedIndex=0;$('mobBrainPreset').value='aggressive';$('mobBrainVision').value=8;$('mobBrainLeash').value=12;$('mobBrainRadius').value=7;$('mobBrainThink').value=900;$('mobBrainFleeHp').value=0}function editMob(id){const m=state.mobs.find(x=>x.id===id);if(!m)return;const b=m.brain||{};$('mobId').value=m.id;$('mobName').value=m.name;$('mobBase').value=m.baseKind;$('mobHp').value=m.hitPoints;$('mobRespawn').value=m.respawnMs;$('mobArmor').value=m.armorLevel;$('mobWeapon').value=m.weaponLevel;$('mobAggro').value=m.aggroDistance;$('mobDrops').value=(m.drops||[]).map(d=>d.kind+':'+d.chance).join('\\n');$('mobBrainPreset').value=b.preset||'aggressive';$('mobBrainVision').value=b.vision||8;$('mobBrainLeash').value=b.leash||12;$('mobBrainRadius').value=b.wanderRadius||7;$('mobBrainThink').value=b.thinkMs||900;$('mobBrainFleeHp').value=Math.round((b.fleeBelowHp||0)*100);document.querySelector('[data-tab=\"mob\"]').click()}\nfunction saveMob(){const id=$('mobId').value||'mob_'+Math.random().toString(16).slice(2),m={id,name:$('mobName').value||'Novo Mob',baseKind:$('mobBase').value,hitPoints:+$('mobHp').value,respawnMs:+$('mobRespawn').value,armorLevel:+$('mobArmor').value,weaponLevel:+$('mobWeapon').value,aggroDistance:+$('mobAggro').value,drops:parseDrops(),brain:brainMob(),enabled:true};const i=state.mobs.findIndex(x=>x.id===id);if(i>=0)state.mobs[i]=m;else state.mobs.push(m);$('mobId').value=id;markDirty();renderLists()}"
          s = replace_once(s, old, new, 'world-editor mob JS')
          p.write_text(s)

          # ---- package check ----
          p = Path('package.json')
          s = p.read_text()
          s = replace_once(
              s,
              'node --check server/js/map.js && node --check server/js/mob.js',
              'node --check server/js/map.js && node --check server/js/brain.js && node --check server/js/mob.js',
              'package brain syntax check'
          )
          p.write_text(s)
          PY

          git config user.name 'SrTristeSad'
          git config user.email '48489740+SrTristeSad@users.noreply.github.com'
          git add server/js/worldserver.js server/admin/world-store.js server/admin/public/world-editor.html package.json
          git rm .github/workflows/apply-brain-runtime.yml
          git commit -m 'feat: wire Brain System into NPCs, mobs and World Editor'
          git push origin brain-system
