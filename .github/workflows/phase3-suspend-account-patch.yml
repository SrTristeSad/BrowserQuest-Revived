name: Phase 3 Suspend Account Patch

on:
  push:
    branches: [phase3-suspend-account]

permissions:
  contents: write

jobs:
  patch-suspend-account:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply suspend account patch
        run: node scripts/phase3-suspend-account-patch.mjs
      - name: Syntax check
        run: node --check server/admin/http.js
      - name: Commit suspend account patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/admin/http.js
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "feat: suspend player accounts"
            git push
          fi
