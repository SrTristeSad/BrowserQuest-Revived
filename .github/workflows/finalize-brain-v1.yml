name: Finalize Brain System v1

on:
  push:
    branches: [brain-system]
    paths:
      - '.github/workflows/finalize-brain-v1.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: brain-system
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Apply final Brain v1 fixes
        run: |
          python3 scripts/finalize-brain-v1.py
          python3 scripts/patch-brain-ci.py

      - name: Install and test
        run: |
          npm ci --no-audit --no-fund
          npm run check
          node test/brain-smoke.js

      - name: Commit final Brain v1
        shell: bash
        run: |
          git config user.name 'SrTristeSad'
          git config user.email '48489740+SrTristeSad@users.noreply.github.com'
          git add server/js/brain.js server/admin/world-store.js client/js/character.js package.json .github/workflows/ci.yml test/brain-smoke.js
          git rm .github/workflows/finalize-brain-v1.yml scripts/finalize-brain-v1.py scripts/patch-brain-ci.py
          git commit -m 'test: harden Brain System movement and behavior'
          git push origin brain-system
