name: Phase 3 Kick Flush Fix

on:
  push:
    branches: [phase3-kick-flush-e2e]

permissions:
  contents: write

jobs:
  patch-kick-flush:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply kick flush fix
        run: node scripts/phase3-kick-flush-fix.mjs
      - name: Syntax check
        run: |
          node --check server/js/player.js
          node --check server/js/main.js
          node --check server/admin/http.js
      - name: Commit kick flush fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+SrTristeSad@users.noreply.github.com"
          git add server/js/player.js server/js/main.js server/admin/http.js
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "fix: await pending persistence on admin kick"
            git push
          fi
