name: Patch client WSS

on:
  push:
    branches: [aapanel-visual-installer]
    paths: [.github/workflows/patch-client-wss.yml]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Patch WebSocket URL and remove one-time workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('client/js/gameclient.js')
          s = p.read_text()
          old = 'var url = "ws://"+ this.host +":"+ this.port +"/",'
          new = 'var scheme = window.location.protocol === "https:" ? "wss://" : "ws://",\\n                url = scheme + this.host + ":" + this.port + "/",'
          if old not in s:
              raise SystemExit('target websocket line not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/patch-client-wss.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/js/gameclient.js .github/workflows/patch-client-wss.yml
          git commit -m "fix: use secure WebSocket behind HTTPS proxy"
          git push origin aapanel-visual-installer
