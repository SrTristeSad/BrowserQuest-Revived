name: Phase 4 Story Progress Restart E2E Patch

on:
  push:
    branches: [phase4-story-progress-restart-e2e]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply patch
        run: node scripts/phase4-story-progress-restart-e2e.mjs
      - name: Syntax check
        run: node --check server/js/player.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/js/player.js .github/workflows/account-persistence-restart.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "test: verify story progress across restart"
            git push
          fi
