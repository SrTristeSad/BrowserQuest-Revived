name: Fix client WSS patch

on:
  push:
    branches: [aapanel-visual-installer]
    paths: [.github/workflows/fix-client-wss.yml]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Repair newline and remove one-time workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('client/js/gameclient.js')
          s = p.read_text()
          broken = 'var scheme = window.location.protocol === "https:" ? "wss://" : "ws://",\\n                url = scheme + this.host + ":" + this.port + "/",'
          fixed = 'var scheme = window.location.protocol === "https:" ? "wss://" : "ws://",\n                url = scheme + this.host + ":" + this.port + "/",'
          if broken not in s:
              raise SystemExit('broken websocket patch not found')
          p.write_text(s.replace(broken, fixed, 1))
          PY
          rm .github/workflows/fix-client-wss.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/js/gameclient.js .github/workflows/fix-client-wss.yml
          git commit -m "fix: repair secure WebSocket client syntax"
          git push origin aapanel-visual-installer
