name: Phase 3 Announcement Display Patch

on:
  push:
    branches: [phase3-announcement-display]

permissions:
  contents: write

jobs:
  patch-announcement-display:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply announcement display patch
        run: node scripts/phase3-announcement-display-patch.mjs
      - name: Verify announcement display wiring
        run: |
          grep -q 'id="admin-announcement"' client/index.html
          grep -q 'showAnnouncement: function' client/js/app.js
          grep -q 'onAnnouncement(function' client/js/game.js
          node --check client/js/app.js
          node --check client/js/game.js
      - name: Commit announcement display patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+SrTristeSad@users.noreply.github.com"
          git add client/index.html client/js/app.js client/js/game.js
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "feat: display admin announcements in game"
            git push
          fi
