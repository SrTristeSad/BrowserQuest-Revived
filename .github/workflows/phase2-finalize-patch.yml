name: Phase 2 Finalize Patch

on:
  push:
    branches: [phase2-persistence-e2e]

permissions:
  contents: write

jobs:
  patch-player:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply focused patch
        run: node scripts/phase2-finalize-patch.mjs
      - name: Syntax check
        run: node --check server/js/player.js
      - name: Commit player fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/js/player.js
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "fix: send account equipment sync only once"
            git push
          fi
