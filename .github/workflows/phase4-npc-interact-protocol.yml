name: Phase 4 NPC Interact Protocol

on:
  push:
    branches: [phase4-npc-interact-protocol]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply patch
        run: node scripts/phase4-npc-interact-protocol.mjs
      - name: Syntax check
        run: node --check server/js/format.js && node --check server/js/player.js && node --check client/js/gameclient.js && node --check client/js/game.js && node --check shared/js/gametypes.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+SrTristeSad@users.noreply.github.com"
          git add shared/js/gametypes.js server/js/format.js server/js/player.js client/js/gameclient.js client/js/game.js
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "feat: add validated NPC interaction protocol"
            git push
          fi
